services:
  db:
    image: postgres:16-alpine
    container_name: swisspension_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - internal_net
    restart: unless-stopped

  backend_python:
    build:
      context: ./backend_python
    container_name: swisspension_api
    env_file:
      - .env
    environment:
      # Fallback: konstruiere URL aus einzelnen Variablen, falls DATABASE_URL nicht gesetzt ist
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      - db
    networks:
      - internal_net
    ports:
      - "8002:8000" # API nach außen
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swisspension_web
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    depends_on:
      - backend_python
    networks:
      - internal_net
    ports:
      - "3001:80" # Nginx static frontend
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge
