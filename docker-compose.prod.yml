services:
  db:
    image: postgres:16-alpine
    container_name: pension_pal_db
    env_file:
      - ./deployment-config/strato-vps.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY}/backend:${IMAGE_TAG:-latest}
    container_name: pension_pal_backend
    env_file:
      - ./deployment-config/strato-vps.env
      # SMTP_* des No-Reply-Postfachs (wie Budget-Pal); nur auf dem Server, nicht im Git.
      # Fehlt die Datei, gehen keine Mails raus ("Passwort vergessen" antwortet trotzdem).
      - path: ./deployment-config/smtp.env
        required: false
    environment:
      APP_ENV: production
      APP_BASE_URL: https://pensionpal.doebele12.de
      # Passkeys sind fest an die Domain gebunden — mit localhost lehnt der Browser jeden ab
      WEBAUTHN_RP_ID: pensionpal.doebele12.de
      WEBAUTHN_ORIGINS_RAW: https://pensionpal.doebele12.de
      DATABASE_URL: ${DATABASE_URL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.00

  web:
    image: ${DOCKER_REGISTRY}/web:${IMAGE_TAG:-latest}
    container_name: pension_pal_web
    env_file:
      - ./deployment-config/strato-vps.env
    environment:
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.50

  nginx:
    image: nginx:1.27-alpine
    container_name: pension_pal_nginx
    env_file:
      - ./deployment-config/strato-vps.env
    depends_on:
      - web
      - backend
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_HTTP_PORT:-18080}:8080"
    volumes:
      - ./deployment-config/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deployment-config/nginx-docker-entrypoint.sh:/docker-entrypoint.d/99-generate-config.sh:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50

volumes:
  db_data:
  uploads_data:
